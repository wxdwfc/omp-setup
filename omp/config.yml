modelRoles:
  default: openai-codex/gpt-6-astra:high
  Daily: deepseek/deepseek-flash:high
  wording: openai-codex/gpt-6-astra:high
  tiny: openai-codex/gpt-6.1-sol:high
  smol: openai-codex/gpt-6.1-terra:xhigh
symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: research-night
  light: research-day
setupVersion: 2
expandThinkingBlocks: false
task:
  agentModelOverrides:
    reviewer: deepseek/deepseek-v4-flash
hideThinkingBlock: true
statusLine:
  preset: custom
  separator: none
  transparent: true
  sessionAccent: false
  leftSegments:
    - model
    - path
    - git
  rightSegments:
    - usage
    - context_pct
  compactThinkingLevel: false
display:
  shimmer: classic
  pinnedAgents: collapsed
  subagentLivePreview: true
cycleOrder:
  - smol
  - default
  - slow
  - Daily
  - wording
dev:
  autoqaConsent: granted
retry:
  maxRetries: 3
  baseDelayMs: 1000
  maxDelayMs: 30000
skills:
  customDirectories:
    - /Users/wxd/.codex/skills
codexResets:
  autoRedeem: "no"